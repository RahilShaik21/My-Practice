<!DOCTYPE html>
<html lang="en">
<head>
    <title>Date</title>
</head>
<body>
    <button class="myBtn">fevh</button>
    <div class="myDiv">this is div</div>
    <script>
        let myDate=new Date();
        console.log(myDate.getTime());
        console.log(myDate.getHours());
        console.log(myDate.getMilliseconds());
        console.log(myDate.getFullYear());
        let btn=document.createElement('Button');
        btn.innerText='click';
        document.querySelector('.myDiv').appendChild(btn);
        document.querySelector('.myDiv').appeChild(btn);
    </script>
</body>
</html>
