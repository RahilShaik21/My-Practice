    <script>
    console.log(checkEvenOdd(72));
       function checkEvenOdd(num){
            if(num%2==0){
                return 'even';
            }
            else{
                return 'odd';
            }
        }
    console.log(getBig(67,38));
        function getBig(num1,num2){
            return num1>num2?num1:num2;
        }
    console.log(convertCtoF(29));
        function convertCtoF(n){
            return (9/5)*n + 32;
        }
    </script>
